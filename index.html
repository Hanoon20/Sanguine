<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2a0a12" />
    <title>Hamdhan &amp; Sara — You are invited</title>
    <meta name="description" content="A wedding invitation from Hamdhan and Sara." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Only the weights the styles actually use, loaded without blocking
         the first paint. Text shows in the fallback face until they land. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Amiri&family=Cormorant:ital,wght@0,400..700;1,400..700&family=EB+Garamond:ital@0;1&family=Josefin+Sans:wght@300;400&family=Pinyon+Script&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri&family=Cormorant:ital,wght@0,400..700;1,400..700&family=EB+Garamond:ital@0;1&family=Josefin+Sans:wght@300;400&family=Pinyon+Script&display=swap" media="print" onload="this.media='all'" />
    <!-- The cover photo is otherwise only discovered once the script has run.
         Browsers without AVIF skip this and fetch the WebP as before. -->
    <link rel="preload" as="image" type="image/avif" href="/src/assets/cover.avif" fetchpriority="high" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri&family=Cormorant:ital,wght@0,400..700;1,400..700&family=EB+Garamond:ital@0;1&family=Josefin+Sans:wght@300;400&family=Pinyon+Script&display=swap" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
